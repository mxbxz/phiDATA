<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Phi Data · Phigros .pez 资源下载</title>
<meta name="description" content="Phigros 官方谱面转制的 Phira .pez 资源站，327 首曲目、1037 个谱面，可搜索并下载。">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230E7C8C'/%3E%3Cpath d='M13 23V11l10-2v10' stroke='%23fff' stroke-width='2.2' fill='none' stroke-linecap='round'/%3E%3Ccircle cx='11' cy='23' r='2.6' fill='%23fff'/%3E%3Ccircle cx='21' cy='19' r='2.6' fill='%23fff'/%3E%3C/svg%3E">
<style>
  :root{
    --paper:#F6F7F9; --surface:#fff; --ink:#14171C; --muted:#6E7681;
    --line:#E3E6EB; --accent:#0E7C8C;
    --ez:#2F8F5B; --hd:#2F6FD0; --in:#BC4238; --at:#7350C8;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{background:var(--paper);color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",Roboto,Helvetica,Arial,sans-serif;
    -webkit-font-smoothing:antialiased;line-height:1.5}
  .wrap{max-width:1080px;margin:0 auto;padding:0 20px}
  .top{padding:26px 0 18px}
  .brand{display:flex;align-items:center;gap:11px}
  .logo{width:38px;height:38px;border-radius:10px;background:var(--accent);display:grid;place-items:center;flex:0 0 auto}
  .brand h1{font-size:21px;margin:0;letter-spacing:.2px}
  .brand p{margin:2px 0 0;color:var(--muted);font-size:13px}
  .search{margin-top:16px;position:relative}
  .search input{width:100%;height:44px;border:1px solid var(--line);background:var(--surface);
    border-radius:11px;padding:0 14px 0 42px;font-size:15px;color:var(--ink);outline:none}
  .search input:focus{border-color:var(--accent)}
  .search svg{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--muted)}
  .count{color:var(--muted);font-size:13px;margin:14px 0 12px}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(232px,1fr));gap:12px;padding-bottom:40px}
  .card{background:var(--surface);border:1px solid var(--line);border-radius:13px;padding:12px;display:flex;gap:12px;min-width:0}
  .cover{width:84px;height:84px;flex:0 0 84px;border-radius:9px;overflow:hidden;background:#EDEFF3}
  .cover img{width:100%;height:100%;object-fit:cover;display:block}
  .body{min-width:0;flex:1;display:flex;flex-direction:column}
  .name{font-size:14px;font-weight:650;margin:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .meta{color:var(--muted);font-size:11.5px;margin:3px 0 9px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .levels{display:flex;flex-wrap:wrap;gap:6px;margin-top:auto}
  .lv{height:26px;padding:0 9px;border-radius:7px;font-size:12px;font-weight:600;color:#fff;
    display:inline-flex;align-items:center;gap:4px;text-decoration:none}
  .lv b{font-weight:700;opacity:.92}
  .lv-ez{background:var(--ez)} .lv-hd{background:var(--hd)}
  .lv-in{background:var(--in)} .lv-at{background:var(--at)}
  .empty{grid-column:1/-1;text-align:center;color:var(--muted);padding:50px 0}
  @media(max-width:480px){
    .wrap{padding:0 14px}
    .cover{width:68px;height:68px;flex-basis:68px}
    .card{padding:10px;gap:10px}
  }
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="brand">
      <div class="logo">
        <svg width="22" height="22" viewBox="0 0 32 32" fill="none"><path d="M13 24V10l10-2v10" stroke="#fff" stroke-width="2.4" stroke-linecap="round"/><circle cx="11" cy="24" r="2.8" fill="#fff"/><circle cx="21" cy="19" r="2.8" fill="#fff"/></svg>
      </div>
      <div>
        <h1>Phi Data</h1>
        <p>Phigros 官方谱面转制 · Phira .pez 资源下载</p>
      </div>
    </div>
    <div class="search">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.2-3.2" stroke-linecap="round"/></svg>
      <input id="q" type="search" placeholder="搜索曲名、曲师、谱师…" autocomplete="off">
    </div>
  </header>
  <div class="count" id="count"></div>
  <main class="grid" id="grid"></main>
</div>

<script src="songs.js"></script>
<script>
(function () {
  // 下载文件所在的服务器地址（末尾不带斜杠）
  var SERVER_BASE = "https://103.236.97.201:33";
  function fileUrl(rel) { return SERVER_BASE + "/" + rel; }

  function esc(s) {
    return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }

  var songs = window.PHI_SONGS || [];
  var grid = document.getElementById("grid");
  var countEl = document.getElementById("count");
  var q = document.getElementById("q");

  function render(list) {
    var frag = document.createDocumentFragment();
    if (!list.length) {
      var d = document.createElement("div");
      d.className = "empty";
      d.textContent = "没有找到匹配的曲目";
      frag.appendChild(d);
    }
    list.forEach(function (s) {
      var card = document.createElement("article");
      card.className = "card";
      var lvHtml = s.levels.map(function (x) {
        return '<a class="lv lv-' + esc(x.lv.toLowerCase()) + '" href="' + esc(fileUrl(x.pez)) +
          '" download="' + esc(x.pez.split("/").pop()) + '" target="_blank" rel="noopener">' +
          esc(x.lv) + " <b>" + esc(x.ranking) + "</b></a>";
      }).join("");
      card.innerHTML =
        '<div class="cover"><img src="thumbs/' + esc(s.codename) + '.webp" alt="' + esc(s.name) +
          ' 曲绘" width="168" height="168" loading="lazy" decoding="async"></div>' +
        '<div class="body"><h2 class="name">' + esc(s.name) + "</h2>" +
        '<p class="meta">' + esc(s.meta) + "</p>" +
        '<div class="levels">' + lvHtml + "</div></div>";
      frag.appendChild(card);
    });
    grid.innerHTML = "";
    grid.appendChild(frag);
    countEl.textContent = "共 " + list.length + " / " + songs.length + " 首";
  }

  function applyFilter() {
    var kw = q.value.trim().toLowerCase();
    if (!kw) { render(songs); return; }
    render(songs.filter(function (s) {
      return (s.name + " " + s.meta + " " + (s.search || "") + " " + (s.sortname || "")).toLowerCase().indexOf(kw) !== -1;
    }));
  }

  q.addEventListener("input", applyFilter);
  render(songs);
})();
</script>
</body>
</html>
